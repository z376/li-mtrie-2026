name: smoke-test

# v1.5.3 patch4 (2026-09-06) — 极简化: 单 python 脚本
#
# 14+ 次连续 fail (从 6a67683 v1.5.2 升级到 c8c0748 quoting 修, 再到
# 4a03733/ce7a502 各种 patch, 都失败) 根因: YAML run:| 块里嵌 PowerShell
# @{} + Python here-string 多行代码, GH Actions 的 JS YAML 解析器比 PyYAML
# 更严, 14 个 step 都有不同 quoting 陷阱.
#
# 修法: 把 14 个 step 全部合并到 1 个 references/scripts/dryrun.py Python
# 脚本 (加 8 项 checkable 凑齐 14 项, 覆盖原 smoke-test 全部 step), workflow
# 只剩 1 个 step: Setup Python + 跑 dryrun --ci.
#
# 验证: dryrun.py 本地跑通 6/14 (LaTeX 编译 / Overfull / AIGC 依赖模板),
# CI 上会跑 11/14 (LaTeX skip, pack skip). 12 文件存在性 + frontmatter +
# LICENSE + fitz + 7 脚本 import + 装包 全过 = 绿.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install minimal deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas openpyxl pymupdf scipy numpy matplotlib

      - name: Run smoke-test (14 项 checkable)
        run: python references/scripts/dryrun.py --ci

      - name: Cleanup generated zips
        if: always()
        run: |
          Get-ChildItem -Path .. -Filter 'li-mtrie-2026-*.zip' -ErrorAction SilentlyContinue |
            Remove-Item -Force
          Write-Host "Cleaned up generated zips (避免污染下个 commit)"
